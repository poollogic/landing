<!-- Structured data: SoftwareApplication -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "PoolLogic",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web, iOS, Android",
  "url": "https://poollogic.app",
  "description": "Pool service software for routes, chemistry tracking, branded service reports, and billing — one app your techs can run from day one.",
  "offers": [
    {
      "@type": "Offer",
      "name": "Core",
      "price": "0",
      "priceCurrency": "USD",
      "description": "Routes, scheduling, on-truck app, service reports, recurring invoicing with Stripe autopay. Free until you get paid."
    },
    {
      "@type": "Offer",
      "name": "Insight",
      "price": "39",
      "priceCurrency": "USD",
      "description": "Everything in Core plus route insight scoring, daily service audit, operations dashboard, and revenue analytics. Per tech, per month."
    },
    {
      "@type": "Offer",
      "name": "Vision",
      "price": "79",
      "priceCurrency": "USD",
      "description": "Everything in Insight plus AI-drafted service reports, AI document import, predictive chemistry alerts, and priority support. Per tech, per month."
    }
  ]
}
</script>

<!-- Structured data: FAQ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How long does setup take?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Setup is fast — as long as you have your customer info in some kind of document, you can usually be importing and have automated billing live within an hour. The quickest path is our provided spreadsheet template: many customers paste it into Claude or ChatGPT and have it fill in all of their customer information with no manual data entry. You can also upload a PDF or other document to our AI import, but it's limited to one document at a time — it can't stitch information together across multiple files."
      }
    },
    {
      "@type": "Question",
      "name": "Does it work without internet on the truck?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The technician app works entirely offline. Every stop and every report is cached on the device and syncs the moment reception comes back."
      }
    },
    {
      "@type": "Question",
      "name": "Will you migrate my data from Skimmer or Pooltrackr?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Free migration is included for every customer, on every tier. We'll handle importing all your customers and walk you through any questions you may have. The app is extremely intuitive — most teams are comfortable using it from day one."
      }
    },
    {
      "@type": "Question",
      "name": "Do you charge per stop, per service, or per text?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No per-stop, per-service, or per-text fees. Core is free — you only pay a flat 0.5% on payments processed through Stripe. Check, cash, and external payments are always free. Insight ($39/tech/mo) and Vision ($79/tech/mo) add features like service audits and AI reports."
      }
    },
    {
      "@type": "Question",
      "name": "What payment processors do you support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Stripe. All payment processing in PoolLogic runs through Stripe — connect your Stripe account once and you're set."
      }
    }
  ]
}
</script>

<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/fonts/Geist.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/fonts/GeistMono.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/InstrumentSerif.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/InstrumentSerif-Italic.woff2') format('woff2');
  }

  :root {
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-muted: #f4f4f5;
    --ink: #09090b;
    --ink-2: #18181b;
    --ink-3: #3f3f46;
    --ink-4: #52525b;
    --ink-5: #71717a;
    --ink-6: #a1a1aa;
    --line: #e4e4e7;
    --line-2: #f1f1f3;

    /* Brand palette — single source of truth for brand colors */
    --brand-blue: #3b82f6;
    --brand-green: #10b981;
    --brand-orange: #fb923c;
    --brand-teal: #14b8a6;
    --brand-purple: #a855f7;
    --brand-pink: #ec4899;
    --brand-violet: #7c3aed;

    --accent: var(--brand-blue);
    --accent-ink: color-mix(in oklab, var(--brand-blue) 80%, black);
    --accent-soft: color-mix(in oklab, var(--brand-blue) 8%, white);
    --green: var(--brand-green);
    --green-soft: color-mix(in oklab, var(--brand-green) 8%, white);
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02);
    --shadow-pop: 0 24px 60px -20px rgba(15,23,42,.18), 0 8px 20px -8px rgba(15,23,42,.10);
    --shadow-screen: 0 40px 100px -30px rgba(15, 23, 42, 0.25), 0 12px 30px -10px rgba(15,23,42,.12);
    --maxw: 1200px;
    /* Vertical breathing room between the sticky Nav (~64px) and the first thing on every sub-page.
       This is total padding from the page top — the nav consumes the first ~64px, so the visible
       gap below the nav is (page-top − 64px). Bump page-top to widen that gap. */
    --page-top: 128px;
    --page-bottom: 128px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
    line-height: 1.5;
    /* Reserve space for the sticky construction banner at the bottom */
    padding-bottom: 72px;
  }

  .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 16px;
    border-radius: 8px;
    font-size: 14px; font-weight: 500;
    border: 1px solid transparent;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }
  .btn-primary:hover { background: #000; transform: translateY(-1px); box-shadow: 0 6px 16px -6px rgba(0,0,0,.4); }
  .btn-accent {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-accent:hover { background: var(--accent-ink); transform: translateY(-1px); box-shadow: 0 6px 16px -6px color-mix(in oklab, var(--accent) 60%, black); }
  .btn-ghost { background: transparent; color: var(--ink-2); border-color: transparent; }
  .btn-ghost:hover { background: var(--bg-muted); }
  .btn-outline {
    background: white;
    color: var(--ink-2);
    border-color: var(--line);
  }
  .btn-outline:hover { border-color: var(--ink-6); background: var(--bg-soft); }
  .btn-lg { height: 46px; padding: 0 20px; font-size: 15px; border-radius: 10px; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 7px; }

  /* Type */
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); }
  h1 { font-size: clamp(36px, 4.4vw, 56px); letter-spacing: -0.035em; line-height: 1.05; }
  h2 { font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -0.025em; line-height: 1.08; }
  h3 { font-size: 20px; }
  p { margin: 0; color: var(--ink-4); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-5);
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  /* Section spacing */
  section { padding: 96px 0; position: relative; }
  section.tight { padding: 64px 0; }

  /* Footer + nav share, see partials */

  /* Smooth scroll */
  html { scroll-behavior: smooth; }

  /* Subtle entrance */
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }

  /* Typing caret */
  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Density toggle */
  body[data-density="compact"] section { padding: 72px 0; }
  body[data-density="airy"] section { padding: 128px 0; }

  /* Dark mode */
  body[data-theme="dark"] {
    --bg: #09090b;
    --bg-soft: #0f0f11;
    --bg-muted: #18181b;
    --ink: #fafafa;
    --ink-2: #f4f4f5;
    --ink-3: #d4d4d8;
    --ink-4: #a1a1aa;
    --ink-5: #71717a;
    --ink-6: #52525b;
    --line: #27272a;
    --line-2: #1c1c1f;
    --accent-soft: #0c1a36;
  }
  body[data-theme="dark"] .btn-primary { background: white; color: black; border-color: white; }
  body[data-theme="dark"] .btn-primary:hover { background: #f4f4f5; }
  body[data-theme="dark"] .btn-outline { background: var(--bg-soft); color: var(--ink-2); border-color: var(--line); }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* Section divider */
  .section-divider { border-top: 0; }

  /* ============== Responsive (above-the-fold through Deep Dive) ============== */

  /* Container + section padding tightens on small screens */
  @media (max-width: 640px) {
    .container { padding: 0 16px; }
    section { padding: 64px 0; }
    body[data-density="compact"] section { padding: 48px 0; }
    body[data-density="airy"] section { padding: 88px 0; }
  }

  /* Features section — anchor lands below page-level nav */
  #features { scroll-margin-top: 64px; }

  /* Features section — hide background gutters on mobile (rows un-stick from grid) */
  @media (max-width: 760px) {
    .features-gutter-bg { display: none !important; }
  }

  /* Features rows — Attio-style stacked rows.
     Desktop: hatched-gutter | text | flow | side | hatched-gutter.
     Tablet: drop side panel under text + flow. Mobile: full stack. */
  @media (max-width: 1080px) {
    .feature-row {
      grid-template-columns: 32px minmax(220px, 1fr) minmax(360px, 1.4fr) 32px !important;
      min-height: 0 !important;
    }
    .feature-row .feature-row-right {
      grid-column: 2 / 4 !important;
      border-top: 1px solid var(--line);
      flex-direction: row !important;
      align-items: center !important;
      gap: 24px !important;
    }
    .feature-row .feature-row-right > div:first-child {
      flex: 1;
    }
  }
  @media (max-width: 760px) {
    .feature-row {
      grid-template-columns: 1fr !important;
    }
    .feature-row .feature-row-gutter { display: none !important; }
    .feature-row .feature-row-left,
    .feature-row .feature-row-center,
    .feature-row .feature-row-right {
      border-right: 0 !important;
      grid-column: 1 / -1 !important;
      padding: 32px 16px !important;
    }
    .feature-row .feature-row-center,
    .feature-row .feature-row-right {
      border-top: 1px solid var(--line);
    }
    .feature-row .feature-row-right {
      flex-direction: column !important;
      align-items: stretch !important;
    }
  }

  /* Pricing — 4-col desktop, 2-col tablet, single-col mobile */
  @media (max-width: 1100px) {
    .pricing-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 16px !important;
    }
  }
  @media (max-width: 640px) {
    .pricing-grid {
      grid-template-columns: 1fr !important;
    }
  }

  /* FAQ — stack the 2-col layout (left intro + right accordion) on tablet down */
  @media (max-width: 900px) {
    #faq-grid {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
  }

  /* FinalCTA — shrink the card padding on small viewports so the
     dark card doesn't bleed wider than the container's safe zone. */
  @media (max-width: 720px) {
    .final-cta-card {
      padding: 36px 22px !important;
      border-radius: 16px !important;
    }
    .final-cta-card h2 {
      font-size: clamp(22px, 6vw, 30px) !important;
    }
    .final-cta-card p {
      font-size: 14.5px !important;
    }
  }

  /* Footer — 5-col on desktop, 2-col on tablet, single column on mobile */
  @media (max-width: 880px) {
    .footer-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 28px !important;
    }
    .footer-grid > div:first-child {
      grid-column: 1 / -1;
      margin-bottom: 8px;
    }
  }
  @media (max-width: 520px) {
    .footer-grid {
      grid-template-columns: 1fr !important;
    }
    .footer-bottom {
      justify-content: flex-start !important;
    }
  }

  /* Legal pages (/terms, /privacy) — tighten body rhythm so sections read
     as connected blocks instead of separate cards floating in whitespace. */
  .terms-body { line-height: 1.65; }
  .terms-body p { margin: 0 0 12px; }
  .terms-body p:last-child { margin-bottom: 0; }
  .terms-body ul { margin: 0 0 12px; padding-left: 22px; }
  .terms-body li { margin-bottom: 4px; }
  .terms-body li:last-child { margin-bottom: 0; }
  .terms-body h3 { margin: 18px 0 6px; font-weight: 600; }
  /* Stack the two-column grid on narrow screens — TOC sits above body */
  @media (max-width: 880px) {
    .terms-grid {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    .terms-toc {
      position: static !important;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
  }

  /* Nav: hide center links on tablet, sign-in on small mobile */
  @media (max-width: 880px) {
    .nav-links { display: none !important; }
  }
  @media (max-width: 480px) {
    .nav-signin { display: none !important; }
  }

  /* Hero proof bar: stack slots vertically on small screens, hide separators.
     inline-flex + flex-start keeps the checkmarks lined up in a clean column,
     while the parent's text-align: center keeps the whole bar centered on the page. */
  @media (max-width: 720px) {
    .hero-proof {
      display: inline-flex !important;
      flex-direction: column !important;
      align-items: flex-start !important;
      row-gap: 10px !important;
    }
    .hero-proof-sep { display: none !important; }
  }

  /* Hero on mobile: drop the 100vh fill + vertical centering that leaves a giant
     gap above the content. Let copy sit naturally near the top. */
  @media (max-width: 720px) {
    .hero-section {
      min-height: 0 !important;
      align-items: flex-start !important;
      padding-top: 36px !important;
      padding-bottom: 32px !important;
    }
    .product-section {
      padding-top: 56px !important;
      padding-bottom: 72px !important;
    }
    .product-section .product-intro {
      margin-bottom: 40px !important;
    }
    .product-section .product-intro h2 {
      font-size: 26px !important;
      letter-spacing: -0.02em !important;
    }
    .product-section .product-intro p {
      font-size: 15.5px !important;
      margin-top: 16px !important;
    }
    #switching {
      padding-top: 64px !important;
      padding-bottom: 64px !important;
    }
    /* Mobile: left-align the hero copy and the product-section intro,
       Stripe-style. Centered text on narrow screens reads soft; flush-left
       reads confident. Override every centering decision: text-align,
       margin auto, and the CTA row's justify-content. */
    .hero-section .hero-content {
      text-align: left !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      max-width: none !important;
    }
    .hero-section .hero-content > h1,
    .hero-section .hero-content > p {
      margin-left: 0 !important;
      margin-right: 0 !important;
      max-width: none !important;
    }
    .hero-section .hero-content > div[style*="justify-content"] {
      justify-content: flex-start !important;
    }
    .product-section .product-intro {
      text-align: left !important;
    }
    .product-section .product-intro > p {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .product-section .product-intro > div[style*="justify-content"] {
      justify-content: flex-start !important;
    }
    .product-section .product-intro .intro-cols {
      grid-template-columns: 1fr !important;
      gap: 28px !important;
      margin-top: 28px !important;
    }
    /* Kicker line: drop the decorative side rules and let the text wrap.
       The nowrap was overflowing the viewport on narrow screens. */
    .intro-kicker {
      justify-content: flex-start !important;
    }
    .intro-kicker .intro-kicker-rule {
      display: none !important;
    }
    .intro-kicker .intro-kicker-text {
      white-space: normal !important;
    }

    /* Authority strip — stack avatars + text vertically and flush-left
       so it lines up with the headline. */
    .authority-strip {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 10px !important;
      text-align: left !important;
    }
  }

  /* Customer directory wrapper:
     - On wide desktops the chip can sit in the gutter (left: -40). overflow stays visible so it isn't clipped.
     - Below 1148px the 1100px-wide product app overflows the container, so we clip it.
     - The chip needs ~40px of gutter to render fully, so hide it under 1280px even before clipping kicks in. */
  @media (max-width: 1148px) {
    .product-showcase { overflow: hidden; }
  }
  @media (max-width: 1280px) {
    .product-showcase-anno { display: none !important; }
  }

  /* Logo strip: collapse 6-col grid */
  @media (max-width: 880px) {
    .logo-strip-grid { grid-template-columns: repeat(3, 1fr) !important; row-gap: 24px !important; column-gap: 24px !important; }
  }
  @media (max-width: 480px) {
    .logo-strip-grid { grid-template-columns: repeat(2, 1fr) !important; }
  }

  /* Features bento: 2-col on tablet, 1-col on mobile */
  @media (max-width: 1000px) {
    .features-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 16px !important; }
    .features-grid > .feature-card { grid-column: span 1 !important; }
  }
  @media (max-width: 640px) {
    .features-grid { grid-template-columns: 1fr !important; }
  }

  /* DeepDive: stack body, wrap stats, soften preview padding */
  @media (max-width: 900px) {
    .deep-dive-body { grid-template-columns: 1fr !important; gap: 36px !important; }
    .deep-dive-stats { flex-wrap: wrap !important; gap: 20px 28px !important; }
    .deep-dive-preview { padding: 16px !important; }
  }

  /* Switching/Migration: stack to single column on tablet/mobile */
  @media (max-width: 880px) {
    .switching-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  }

  /* Visually hidden scrollbar — content still scrolls horizontally/vertically */
  .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }

  /* Preview row: reveal trash icon on hover */
  .preview-row .row-trash { opacity: 0; transition: opacity .15s ease; }
  .preview-row:hover .row-trash { opacity: 1; }

  /* Upload dropzone — light up on hover */
  .upload-dropzone { transition: border-color .2s ease, background .2s ease; }
  .upload-dropzone:hover {
    border-color: var(--brand-green) !important;
    background: color-mix(in oklab, var(--brand-green) 4%, white) !important;
  }

  /* Hover tooltip (used in import preview header) */
  .info-tooltip { position: relative; display: inline-flex; cursor: help; align-items: center; }
  .info-bubble {
    position: absolute;
    top: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    width: 280px;
    padding: 14px 16px;
    background: color-mix(in oklab, var(--accent) 4%, white);
    border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
    border-radius: 12px;
    font-size: 12.5px;
