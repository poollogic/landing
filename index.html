<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/fonts/Geist.woff2') format('woff2-variations');
  }
  /* Arial resized to Geist's metrics (measured from the font files at 400, 500 and 600, the weights the
     site's pages use), so text keeps its size and line breaks while Geist loads: no shift when it swaps
     in. As with Satoshi's (landing/landing.css), Liberation Sans (Linux, and the deploy's check) or Arimo
     (ChromeOS) stand in where there's no Arial: both are drawn to Arial's widths. */
  @font-face {
    font-family: 'Geist Fallback';
    src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'), local('Arimo-Regular');
    font-weight: 100 449;
    size-adjust: 105.03%;
    ascent-override: 95.69%;
    descent-override: 28.09%;
    line-gap-override: 0%;
  }
  @font-face {
    font-family: 'Geist Fallback';
    src: local('Arial'), local('ArialMT'), local('Liberation Sans'), local('LiberationSans'), local('Arimo'), local('Arimo-Regular');
    font-weight: 450 549;
    size-adjust: 107.36%;
    ascent-override: 93.61%;
    descent-override: 27.48%;
    line-gap-override: 0%;
  }
  @font-face {
    font-family: 'Geist Fallback';
    src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('LiberationSans-Bold'), local('Arimo Bold'), local('Arimo-Bold');
    font-weight: 550 900;
    size-adjust: 101.67%;
    ascent-override: 98.85%;
    descent-override: 29.02%;
    line-gap-override: 0%;
  }
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;

  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/InstrumentSerif.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('/fonts/InstrumentSerif-Italic.woff2') format('woff2');
  }

  :root {
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-muted: #f4f4f5;
    --ink: #09090b;
    --ink-2: #18181b;
    --ink-3: #3f3f46;
    --ink-4: #52525b;
    --ink-5: #71717a;
    --ink-6: #a1a1aa;
    --line: #e4e4e7;
    --line-2: #f1f1f3;

    /* Brand palette — single source of truth for brand colors */
    --brand-blue: #2e85ff;
    --brand-green: #10b981;
    --brand-orange: #fb923c;
    --brand-teal: #14b8a6;
    --brand-purple: #a855f7;
    --brand-pink: #ec4899;
    --brand-violet: #7c3aed;

    --accent: var(--brand-blue);
    --accent-ink: color-mix(in oklab, var(--brand-blue) 80%, black);
    --accent-soft: color-mix(in oklab, var(--brand-blue) 8%, white);
    --green: var(--brand-green);
    --green-soft: color-mix(in oklab, var(--brand-green) 8%, white);
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02);
    --shadow-pop: 0 24px 60px -20px rgba(15,23,42,.18), 0 8px 20px -8px rgba(15,23,42,.10);
    --shadow-screen: 0 40px 100px -30px rgba(15, 23, 42, 0.25), 0 12px 30px -10px rgba(15,23,42,.12);
    /* Marketing layout: one content width and one vertical rhythm for every page. */
    --container-max: 1120px;
    --gutter: clamp(16px, 4vw, 32px);
    --section-y: clamp(64px, 10vw, 128px);
    --section-y-tight: clamp(48px, 6vw, 80px);
    --section-head-gap: 48px; /* section header → its content */
    /* First section under the absolute marketing nav: its height, then a gap. */
    --page-hero-top: calc(var(--header-h, 64px) + clamp(72px, 11vh, 128px));
    /* Vertical breathing room between the sticky Nav (~64px) and the first thing on every sub-page.
       This is total padding from the page top — the nav consumes the first ~64px, so the visible
       gap below the nav is (page-top − 64px). Bump page-top to widen that gap. */
    --page-top: 128px;
    --page-bottom: 128px;

    /* ── Marketing type and spacing tokens (the homepage's roles: landing/home-roles.css) ──
       Phone values here; tablet (640px+) and desktop (1024px+) redefine the responsive ones below,
       so no component needs its own breakpoint for type or spacing. */
    /* Weights: primitives, then the roles components use */
    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;
    --hero-title-weight: var(--fw-bold);
    --statement-weight: var(--fw-semibold);
    --section-title-weight: var(--fw-semibold);
    --closing-weight: var(--fw-semibold);
    --subhead-weight: var(--fw-regular);
    --card-title-weight: var(--fw-semibold);
    --eyebrow-weight: var(--fw-semibold);
    --label-weight: var(--fw-medium);
    /* Sizes */
    --hero-title-size: 36px;
    --statement-size: 30px;
    --section-title-size: 26px;
    --closing-size: 24px;
    --subhead-size: 16px;
    --card-title-size: 16px;
    --eyebrow-size: 12px;
    --label-size: 17px;
    /* Line height and letter spacing, the same at every size */
    --hero-title-leading: 1.06;
    --statement-leading: 1.14;
    --statement-tracking: -0.024em;
    --section-title-leading: 1.18;
    --section-title-tracking: -0.019em;
    --closing-leading: 1.2;
    --closing-tracking: -0.02em;
    --subhead-leading: 1.6;
    --subhead-tracking: normal;
    --label-leading: 1.45;
    /* Spacing */
    --section-pad-y: 64px;
    --head-to-content: 40px;
    --eyebrow-to-title: 14px;
    --title-to-subhead: 12px;
    /* Colours */
    --subhead-on-light: #475569;
    --subhead-on-dark: #94a3b8;
    --eyebrow-on-light: #56657f;
    --eyebrow-on-dark: #93a4bf;
  }
  @media (min-width: 640px) {
    :root {
      --hero-title-size: 44px;
      --statement-size: 34px;
      --section-title-size: 30px;
      --closing-size: 28px;
      --subhead-size: 17px;
      --card-title-size: 17px;
      --eyebrow-size: 12px;
      --label-size: 18px;
      --section-pad-y: 88px;
      --head-to-content: 56px;
      --eyebrow-to-title: 14px;
      --title-to-subhead: 16px;
    }
  }
  @media (min-width: 1024px) {
    :root {
      --hero-title-size: 52px;
      --statement-size: 38px;
      --section-title-size: 32px;
      --closing-size: 30px;
      --subhead-size: 18px;
      --card-title-size: 17px;
      --eyebrow-size: 13px;
      --label-size: 20px;
      --section-pad-y: 112px;
      --head-to-content: 72px;
      --eyebrow-to-title: 14px;
      --title-to-subhead: 16px;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', 'Geist Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
    line-height: 1.5;
    /* Reserve space for the sticky construction banner at the bottom */
    padding-bottom: 72px;
  }

  .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* 1120px of content, centred, with fluid gutters. Nav, sections and footer all use it. */
  .container {
    max-width: calc(var(--container-max) + 2 * var(--gutter));
    margin-inline: auto;
    padding-inline: var(--gutter);
  }
  .section { padding-block: var(--section-y); }
  .section--tight { padding-block: var(--section-y-tight); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 16px;
    border-radius: 8px;
    font-size: 14px; font-weight: 500;
    border: 1px solid transparent;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }
  .btn-primary:hover { background: #000; transform: translateY(-1px); box-shadow: 0 6px 16px -6px rgba(0,0,0,.4); }
  .btn-accent {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-accent:hover { background: var(--accent-ink); transform: translateY(-1px); box-shadow: 0 6px 16px -6px color-mix(in oklab, var(--accent) 60%, black); }
  .btn-ghost { background: transparent; color: var(--ink-2); border-color: transparent; }
  .btn-ghost:hover { background: var(--bg-muted); }
  .btn-outline {
    background: white;
    color: var(--ink-2);
    border-color: var(--line);
  }
  .btn-outline:hover { border-color: var(--ink-6); background: var(--bg-soft); }
  .btn-lg { height: 46px; padding: 0 20px; font-size: 15px; border-radius: 10px; }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 7px; }

  /* Type */
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); }
  h1 { font-size: clamp(36px, 4.4vw, 56px); letter-spacing: -0.035em; line-height: 1.05; }
  h2 { font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -0.025em; line-height: 1.08; }
  h3 { font-size: 20px; }
  p { margin: 0; color: var(--ink-4); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-5);
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  /* Section spacing */
  section { padding: 96px 0; position: relative; }
  section.tight { padding: 64px 0; }

  /* Footer + nav share, see partials */

  /* Smooth scroll */
  html { scroll-behavior: smooth; }

  /* Subtle entrance */
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }

  /* Typing caret */
  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* Density toggle */
  body[data-density="compact"] section { padding: 72px 0; }
  body[data-density="airy"] section { padding: 128px 0; }

  /* Dark mode */
  body[data-theme="dark"] {
    --bg: #09090b;
    --bg-soft: #0f0f11;
    --bg-muted: #18181b;
    --ink: #fafafa;
    --ink-2: #f4f4f5;
    --ink-3: #d4d4d8;
    --ink-4: #a1a1aa;
    --ink-5: #71717a;
    --ink-6: #52525b;
    --line: #27272a;
    --line-2: #1c1c1f;
    --accent-soft: #0c1a36;
  }
  body[data-theme="dark"] .btn-primary { background: white; color: black; border-color: white; }
  body[data-theme="dark"] .btn-primary:hover { background: #f4f4f5; }
  body[data-theme="dark"] .btn-outline { background: var(--bg-soft); color: var(--ink-2); border-color: var(--line); }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* Section divider */
  .section-divider { border-top: 0; }

  /* ============== Responsive (above-the-fold through Deep Dive) ============== */

  /* Container + section padding tightens on small screens */
  @media (max-width: 640px) {
    section { padding: 64px 0; }
    body[data-density="compact"] section { padding: 48px 0; }
    body[data-density="airy"] section { padding: 88px 0; }
  }

  /* Features section — anchor lands below page-level nav */
  #features { scroll-margin-top: 64px; }

  /* Features section — hide background gutters on mobile (rows un-stick from grid) */
  @media (max-width: 760px) {
    .features-gutter-bg { display: none !important; }
  }

  /* Features rows — Attio-style stacked rows.
     Desktop: hatched-gutter | text | flow | side | hatched-gutter.
     Tablet: drop side panel under text + flow. Mobile: full stack.
     The desktop row needs ~1094px; the container gives that from about 1160px. */
  @media (max-width: 1160px) {
    .feature-row {
      grid-template-columns: 32px minmax(220px, 1fr) minmax(360px, 1.4fr) 32px !important;
      min-height: 0 !important;
    }
    .feature-row .feature-row-right {
      grid-column: 2 / 4 !important;
      border-top: 1px solid var(--line);
      flex-direction: row !important;
      align-items: center !important;
      gap: 24px !important;
    }
    .feature-row .feature-row-right > div:first-child {
      flex: 1;
    }
  }
  @media (max-width: 760px) {
    .feature-row {
      grid-template-columns: 1fr !important;
    }
    .feature-row .feature-row-gutter { display: none !important; }
    .feature-row .feature-row-left,
    .feature-row .feature-row-center,
    .feature-row .feature-row-right {
      border-right: 0 !important;
      grid-column: 1 / -1 !important;
      padding: 32px 16px !important;
    }
    .feature-row .feature-row-center,
    .feature-row .feature-row-right {
      border-top: 1px solid var(--line);
    }
    .feature-row .feature-row-right {
      flex-direction: column !important;
      align-items: stretch !important;
    }
  }

  /* Pricing — 4-col desktop, 2-col tablet, single-col mobile.
     Each .pricing-card spans 7 rows of the parent grid and adopts them via
     subgrid, so badge / name / price / blurb / fee / CTA / list align across cards. */
  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: 16px;
    row-gap: 0;
  }
  .pricing-card { display: flex; flex-direction: column; margin-bottom: 24px; }
  @supports (grid-template-rows: subgrid) {
    .pricing-card {
      display: grid;
      grid-template-rows: subgrid;
      grid-row: span 7;
      row-gap: 0;
    }
  }
  @media (max-width: 1000px) {
    .pricing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 620px) {
    .pricing-grid { grid-template-columns: 1fr; }
  }

  /* FAQ — stack the 2-col layout (left intro + right accordion) on tablet down */
  @media (max-width: 900px) {
    #faq-grid {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
  }

  /* FinalCTA — shrink the card padding on small viewports so the
     dark card doesn't bleed wider than the container's safe zone. */
  @media (max-width: 720px) {
    .final-cta-card {
      padding: 36px 22px !important;
      border-radius: 16px !important;
    }
    .final-cta-card h2 {
      font-size: clamp(22px, 6vw, 30px) !important;
    }
    .final-cta-card p {
      font-size: 14.5px !important;
    }
  }

  /* Footer — 5-col on desktop, 2-col on tablet, single column on mobile */
  @media (max-width: 880px) {
    .footer-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 28px !important;
    }
    .footer-grid > div:first-child {
      grid-column: 1 / -1;
      margin-bottom: 8px;
    }
  }
  /* Site footer (components/site-chrome.jsx Footer): the same dark bar on every page. Links go
     white on hover with the nav's glow (.nav-links a:hover in landing/hero.css). */
  .site-footer { background: #0e1015; border-top: 1px solid rgba(148, 163, 184, .10); padding: 24px 0; }
  .site-footer .footer-bottom { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: rgb(148, 163, 184); }
  .site-footer-links { display: inline-flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .site-footer-link { font-size: 13px; line-height: 1.4; color: rgb(148, 163, 184); text-decoration: none; transition: color .3s, text-shadow .3s; }
  .site-footer-link:hover,
  .site-footer-link:focus-visible { color: #F8FAFC; text-shadow: 0 0 18px rgba(147, 197, 253, .55); }

  @media (max-width: 520px) {
    .footer-grid {
      grid-template-columns: 1fr !important;
    }
    .footer-bottom {
      justify-content: flex-start !important;
    }
  }

  /* Legal pages (/terms, /privacy) — tighten body rhythm so sections read
     as connected blocks instead of separate cards floating in whitespace. */
  .terms-body { line-height: 1.65; }
  .terms-body p { margin: 0 0 12px; }
  .terms-body p:last-child { margin-bottom: 0; }
  .terms-body ul { margin: 0 0 12px; padding-left: 22px; }
  .terms-body li { margin-bottom: 4px; }
  .terms-body li:last-child { margin-bottom: 0; }
  .terms-body h3 { margin: 18px 0 6px; font-weight: 600; }
  /* The page-wide `section { padding: 96px 0 }` isn't for these: each one
     keeps only its own 36px under it (Section's marginBottom). */
  .terms-grid article > section { padding: 0; }
  /* Stack the two-column grid on narrow screens — TOC sits above body */
  @media (max-width: 880px) {
    .terms-grid {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    .terms-toc {
      position: static !important;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
  }

  /* Nav: hide center links on tablet, sign-in on small mobile */
  @media (max-width: 880px) {
    .nav-links { display: none !important; }
  }
  @media (max-width: 480px) {
    .nav-signin { display: none !important; }
  }

  /* Hero proof bar: stack slots vertically on small screens, hide separators.
     inline-flex + flex-start keeps the checkmarks lined up in a clean column,
     while the parent's text-align: center keeps the whole bar centered on the page. */
  @media (max-width: 720px) {
    .hero-proof {
      display: inline-flex !important;
      flex-direction: column !important;
      align-items: flex-start !important;
      row-gap: 10px !important;
    }
    .hero-proof-sep { display: none !important; }
  }

  /* Hero on mobile: drop the 100vh fill + vertical centering that leaves a giant
     gap above the content. Let copy sit naturally near the top. */
  @media (max-width: 720px) {
    .hero-section {
      min-height: 0 !important;
      align-items: flex-start !important;
      padding-top: 36px !important;
      padding-bottom: 32px !important;
    }
    .product-section {
      padding-top: 56px !important;
      padding-bottom: 72px !important;
    }
    .product-section .product-intro {
      margin-bottom: 40px !important;
    }
    .product-section .product-intro h2 {
      font-size: 26px !important;
      letter-spacing: -0.02em !important;
    }
    .product-section .product-intro p {
      font-size: 15.5px !important;
      margin-top: 16px !important;
    }
    #switching {
      padding-top: 64px !important;
      padding-bottom: 64px !important;
    }
    /* Mobile: left-align the hero copy and the product-section intro,
       Stripe-style. Centered text on narrow screens reads soft; flush-left
       reads confident. Override every centering decision: text-align,
       margin auto, and the CTA row's justify-content. */
    .hero-section .hero-content {
      text-align: left !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      max-width: none !important;
    }
    .hero-section .hero-content > h1,
    .hero-section .hero-content > p {
      margin-left: 0 !important;
      margin-right: 0 !important;
      max-width: none !important;
    }
    .hero-section .hero-content > div[style*="justify-content"] {
      justify-content: flex-start !important;
    }
    .product-section .product-intro {
      text-align: left !important;
    }
    .product-section .product-intro > p {
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    .product-section .product-intro > div[style*="justify-content"] {
      justify-content: flex-start !important;
    }
    .product-section .product-intro .intro-cols {
      grid-template-columns: 1fr !important;
      gap: 28px !important;
      margin-top: 28px !important;
    }
    /* Kicker line: drop the decorative side rules and let the text wrap.
       The nowrap was overflowing the viewport on narrow screens. */
    .intro-kicker {
      justify-content: flex-start !important;
    }
    .intro-kicker .intro-kicker-rule {
      display: none !important;
    }
    .intro-kicker .intro-kicker-text {
      white-space: normal !important;
    }

    /* Authority strip — stack avatars + text vertically and flush-left
       so it lines up with the headline. */
    .authority-strip {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 10px !important;
      text-align: left !important;
    }
  }

  /* Customer directory wrapper:
     - On wide desktops the chip can sit in the gutter (left: -40). overflow stays visible so it isn't clipped.
     - Below 1164px the 1100px-wide product app overflows the container (1100 + 2 × 32px gutters), so we clip it.
     - The chip needs ~40px of gutter to render fully, so hide it under 1280px even before clipping kicks in. */
  @media (max-width: 1164px) {
    .product-showcase { overflow: hidden; }
  }
  @media (max-width: 1280px) {
    .product-showcase-anno { display: none !important; }
  }

  /* Logo strip: collapse 6-col grid */
  @media (max-width: 880px) {
    .logo-strip-grid { grid-template-columns: repeat(3, 1fr) !important; row-gap: 24px !important; column-gap: 24px !important; }
  }
  @media (max-width: 480px) {
    .logo-strip-grid { grid-template-columns: repeat(2, 1fr) !important; }
  }

  /* Features bento: 2-col on tablet, 1-col on mobile */
  @media (max-width: 1000px) {
    .features-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 16px !important; }
    .features-grid > .feature-card { grid-column: span 1 !important; }
  }
  @media (max-width: 640px) {
    .features-grid { grid-template-columns: 1fr !important; }
  }

  /* DeepDive: stack body, wrap stats, soften preview padding */
  @media (max-width: 900px) {
    .deep-dive-body { grid-template-columns: 1fr !important; gap: 36px !important; }
    .deep-dive-stats { flex-wrap: wrap !important; gap: 20px 28px !important; }
    .deep-dive-preview { padding: 16px !important; }
  }

  /* Switching/Migration: stack to single column on tablet/mobile */
  @media (max-width: 880px) {
    .switching-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  }

  /* Visually hidden scrollbar — content still scrolls horizontally/vertically */
  .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }

  /* Preview row: reveal trash icon on hover */
  .preview-row .row-trash { opacity: 0; transition: opacity .15s ease; }
  .preview-row:hover .row-trash { opacity: 1; }

  /* Upload dropzone — light up on hover */
  .upload-dropzone { transition: border-color .2s ease, background .2s ease; }
  .upload-dropzone:hover {
    border-color: var(--brand-green) !important;
    background: color-mix(in oklab, var(--brand-green) 4%, white) !important;
  }

  /* Hover tooltip (used in import preview header) */
  .info-tooltip { position: relative; display: inline-flex; cursor: help; align-items: center; }
  .info-bubble {
    position: absolute;
    top: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    width: 280px;
    padding: 14px 16px;
    background: color-mix(in oklab, var(--accent) 4%, white);
    border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent);
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--ink-2);
    line-height: 1.55;
    text-transform: none;
    letter-spacing: 0;
    box-shadow: 0 12px 28px -10px rgba(15, 23, 42, .14), 0 2px 6px rgba(15, 23, 42, .04);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .2s cubic-bezier(.2, .8, .2, 1);
    z-index: 10;
    text-align: left;
    white-space: normal;
  }
  .info-tooltip:hover .info-bubble {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .info-bubble strong { color: var(--ink); font-weight: 600; }
</style>
