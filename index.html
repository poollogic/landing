<style>

  :root {
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-muted: #f4f4f5;
    --ink: #09090b;
    --ink-2: #18181b;

    --brand-green: #10b981;
    --brand-orange: #fb923c;
    --brand-teal: #14b8a6;
    --brand-purple: #a855f7;
    --brand-pink: #ec4899;
    --brand-violet: #7c3aed;

    --accent: var(--brand-blue);
    --accent-ink: color-mix(in oklab, var(--brand-blue) 80%, black);
    --accent-soft: color-mix(in oklab, var(--brand-blue) 8%, white);
    --green: var(--brand-green);
    --green-soft: color-mix(in oklab, var(--brand-green) 8%, white);
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02);
    --shadow-pop: 0 24px 60px -20px rgba(15,23,42,.18), 0 8px 20px -8px rgba(15,23,42,.10);
    --shadow-screen: 0 40px 100px -30px rgba(15, 23, 42, 0.25), 0 12px 30px -10px rgba(15,23,42,.12);
    /* Marketing layout: one content width and one vertical rhythm for every page. */
    --container-max: 1120px;
    --gutter: clamp(16px, 4vw, 32px);

    --section-head-gap: 48px; /* section header → its content */
    /* First section under the absolute marketing nav: its height, then a gap. */
    --page-hero-top: calc(var(--header-h, 64px) + clamp(72px, 11vh, 128px));
    /* Vertical breathing room between the sticky Nav (~64px) and the first thing on every sub-page.
       This is total padding from the page top — the nav consumes the first ~64px, so the visible
       gap below the nav is (page-top − 64px). Bump page-top to widen that gap. */
    --page-top: 128px;
    --page-bottom: 128px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  .mono { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* 1120px of content, centred, with fluid gutters. Nav, sections and footer all use it. */

    margin-inline: auto;
    padding-inline: var(--gutter);
  }
  .section { padding-block: var(--section-y); }
  .section--tight { padding-block: var(--section-y-tight); }

    height: 40px; padding: 0 16px;

  .btn-primary {

  /* Section spacing */
  section { padding: 96px 0; position: relative; }

  /* Footer + nav share, see partials */

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {

  .section-divider { border-top: 0; }

  /* ============== Responsive (above-the-fold through Deep Dive) ============== */

  @media (max-width: 640px) {

  @media (max-width: 760px) {

  /* Features rows — Attio-style stacked rows.

  @media (max-width: 1160px) {
    .feature-row {

      min-height: 0 !important;
    }

  /* Pricing — 4-col desktop, 2-col tablet, single-col mobile.

  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: 16px;
    row-gap: 0;
  }
  .pricing-card { display: flex; flex-direction: column; margin-bottom: 24px; }
  @supports (grid-template-rows: subgrid) {

    }
  }

  @media (max-width: 620px) {

  }

  /* Hero proof bar: stack slots vertically on small screens, hide separators.

  /* Hero on mobile: drop the 100vh fill + vertical centering that leaves a giant

  @media (max-width: 720px) {

    .hero-section .hero-content {
