name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Homepage hero SEO guardrails (see CLAUDE.md): crawlable text, asset weight, no layout shift.
      # Uses the Chrome that ships on ubuntu-latest. A failure stops the deploy.
      - name: Check homepage hero SEO guardrails
        run: npm run check:seo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=landing --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
